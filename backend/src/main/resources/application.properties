spring.application.name=fragrance-backend
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fragrance_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fragrance_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-local-only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Schema migrations plus local demo data; set FLYWAY_LOCATIONS=classpath:db/migration to skip the demo seed.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}
app.frontend-origin=${APP_FRONTEND_ORIGIN:http://localhost:5173}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
app.upload-dir=${APP_UPLOAD_DIR:uploads}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:8081/#/checkout/success}
app.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8081/#/checkout/cancel}
app.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:100}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.captcha.enabled=${CAPTCHA_ENABLED:false}
app.captcha.secret=${CAPTCHA_SECRET:}
app.captcha.verify-url=${CAPTCHA_VERIFY_URL:https://hcaptcha.com/siteverify}
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
logging.file.name=${LOGGING_FILE_NAME:logs/fragrance-backend.log}

