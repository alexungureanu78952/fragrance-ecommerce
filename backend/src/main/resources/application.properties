spring.application.name=fragrance-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fragrance_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fragrance_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-local-only}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
