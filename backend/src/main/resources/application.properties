spring.application.name=fragrance-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fragrance_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fragrance_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-local-only}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.frontend-origin=${APP_FRONTEND_ORIGIN:http://localhost:5173}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
app.upload-dir=${APP_UPLOAD_DIR:uploads}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/checkout/success}
app.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/checkout/cancel}
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
