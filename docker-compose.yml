# Full local stack:  docker compose up -d --build   → http://localhost:8081
# Database only (backend run from the IDE):  docker compose up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fragrance_db}
      POSTGRES_USER: ${POSTGRES_USER:-fragrance_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      # Host port for DBeaver and IDE runs; 5433 avoids a local PostgreSQL on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Secrets (Stripe, hCaptcha, database password) are read from .env at runtime
    # and never baked into the image.
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fragrance_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fragrance_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      # Apache is the only way in, so trust its X-Forwarded-For for the client IP
      # (rate limiting and logs see the browser, not the proxy).
      SERVER_FORWARD_HEADERS_STRATEGY: native
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Keep the application/audit log readable on the host.
      - ./backend/logs:/app/logs
    # Not published on the host: the API is reached through Apache at /api.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/v1/auth/csrf || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infra/apache/Dockerfile
      args:
        # Public hCaptcha site key from .env (not a secret).
        VITE_CAPTCHA_SITE_KEY: ${VITE_CAPTCHA_SITE_KEY:-}
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
