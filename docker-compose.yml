services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fragrance_db}
      POSTGRES_USER: ${POSTGRES_USER:-fragrance_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Demo web server: `npm run build:demo` in frontend/, then
  # `docker compose --profile demo up -d`. Open http://localhost:8081.
  web:
    profiles: ["demo"]
    build: ./infra/apache
    ports:
      - "8081:80"
    volumes:
      - ./frontend/dist:/usr/local/apache2/htdocs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
