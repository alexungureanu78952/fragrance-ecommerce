# Demo server: serves the built frontend and proxies the API to the backend
# container, so the browser sees one origin (no CORS or cross-site cookies needed).
ServerTokens Prod
ServerSignature Off

<Directory "/usr/local/apache2/htdocs">
    # Let frontend/public/.htaccess (copied into the build) control access and headers.
    AllowOverride All
    Require all granted
</Directory>

# Preserve the browser's Host header so Spring treats requests as same-origin.
# mod_proxy adds X-Forwarded-For, which the backend uses for the client IP.
ProxyPreserveHost On
# retry=0: do not lock the backend out for 60 s after one failed connection (e.g. while
# it is still starting). addressttl: re-resolve the container's address after restarts.
ProxyPass        /api/ http://backend:8080/api/ retry=0 addressttl=30
ProxyPassReverse /api/ http://backend:8080/api/
