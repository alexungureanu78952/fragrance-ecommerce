# Demo server: serves the built frontend and proxies the API to Spring Boot on the
# host, so the browser sees one origin (no CORS or cross-site cookies needed).
ServerTokens Prod
ServerSignature Off

<Directory "/usr/local/apache2/htdocs">
    # Let frontend/public/.htaccess (copied into the build) control access and headers.
    AllowOverride All
    Require all granted
</Directory>

# Preserve the browser's Host header so Spring treats requests as same-origin.
ProxyPreserveHost On
ProxyPass        /api/ http://host.docker.internal:8080/api/
ProxyPassReverse /api/ http://host.docker.internal:8080/api/
