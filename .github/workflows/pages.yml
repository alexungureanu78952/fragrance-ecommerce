name: Deploy frontend to GitHub Pages

# Publishes the static frontend so the site is reachable online (rubric 7.02) and can
# be audited with Lighthouse (rubric 8.01). The backend runs locally for the demo.
on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".env.pages"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build for GitHub Pages
        working-directory: frontend
        env:
          # Public hCaptcha site key (not a secret); set it as a repository variable.
          VITE_CAPTCHA_SITE_KEY: ${{ vars.VITE_CAPTCHA_SITE_KEY }}
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
